# Libre API Worker configuration.
# Targets the Cloudflare Workers Free plan (§6.2). Local dev uses wrangler's miniflare
# (local D1 + local R2, persisted under .wrangler/).

name = "libre-api"
main = "src/index.ts"
compatibility_date = "2026-09-11"

# Public/non-secret configuration. Secrets (R2_SECRET_ACCESS_KEY, production DB ids)
# live in .dev.vars (local) or Wrangler secrets (remote) — never in this file.
[vars]
# §14 — origins allowed to call the API from the browser. Comma-separated.
# Production origin + development-only origin (remove localhost in production).
ALLOWED_ORIGINS = "https://libre.tv,http://localhost:5173"
# §15 — R2 S3 API endpoint account id (also set in .dev.vars for local runs).
R2_ACCOUNT_ID = "YOUR_R2_ACCOUNT_ID"
# §9.2 — R2 S3 API token access key id (the secret access key is a Wrangler secret).
R2_ACCESS_KEY_ID = "YOUR_R2_ACCESS_KEY_ID"
# Playback presign expiry (seconds). MUST be ≥ the player's playlist refresh cadence
# and < the 7-day R2 maximum (§9.2). 1800 s = 30 min.
PLAYBACK_PRESIGN_TTL_SECONDS = "1800"

# §8 — D1 authoritative relational state. Replace database_id with the id from
# `wrangler d1 create libre-db` (or a preview_database_id for `wrangler dev`).
[[d1_databases]]
binding = "DB"
database_name = "libre-db"
database_id = "663cb5c9-e83c-4f69-b9d8-c0198cddd5ae"
migrations_dir = "migrations"

# §9/§15 — R2 media bucket (private). Presigned access only; never public.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "libre-media"

# Watch parties — realtime room state (Durable Object, 24h rooms).
[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
new_classes = ["PartyRoom"]

# §18 — Workers Rate Limiting API.
# IMPORTANT: namespace_id values below are EXAMPLE ONLY (§18.2). Real rules must be
# created against your account and the ids substituted before `wrangler deploy`.
# Local `wrangler dev` without a valid namespace works because the Worker degrades
# gracefully when the binding is absent. See wrangler.production.toml.example.
#
# [[ratelimits]]
# name = "AUTH_LIMITER"
# namespace_id = "1001"   # EXAMPLE ONLY — replace at deployment
# [ratelimits.simple]
# limit = 10
# period = 60
#
# [[ratelimits]]
# name = "API_LIMITER"
# namespace_id = "1002"   # EXAMPLE ONLY — replace at deployment
# [ratelimits.simple]
# limit = 100
# period = 60
#
# [[ratelimits]]
# name = "PLAYBACK_LIMITER"
# namespace_id = "1003"   # EXAMPLE ONLY — replace at deployment
# [ratelimits.simple]
# limit = 30
# period = 60